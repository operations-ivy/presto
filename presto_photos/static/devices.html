<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07050f">
<title>Handheld Picks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --night:#07050f; --panel:#0e0a1e; --panel-2:#120d24; --line:#241a44; --line-bright:#3a2a6e;
  --text:#e7e3ff; --dim:#a39dd0; --faint:#6f68a0;
  --magenta:#ff2a6d; --cyan:#05d9e8; --amber:#f9c80e; --phosphor:#39ff88; --red:#ff3860;
  --pixel:'Silkscreen', 'Courier New', monospace;
  --ui:'Rajdhani', 'Segoe UI', sans-serif;
  --mono:'Share Tech Mono', 'Courier New', monospace;
  --gutter:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--text);font-family:var(--ui);font-size:17px}
body{min-height:100vh;overflow-x:hidden;padding-bottom:110px}
main{max-width:820px;margin:0 auto;padding:18px var(--gutter) 0}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
h1{font-family:var(--pixel);font-weight:700;font-size:clamp(24px,7vw,36px);margin:0;letter-spacing:2px;line-height:1;
  color:var(--cyan);text-shadow:0 0 4px rgba(5,217,232,.9),0 0 14px rgba(5,217,232,.5)}
header a{color:var(--dim);font-family:var(--mono);font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{font-family:var(--pixel);font-size:14px;letter-spacing:1px;padding:9px 14px;border:1px solid var(--line-bright);
  background:var(--panel);color:var(--dim);border-radius:6px;cursor:pointer}
.tab[aria-selected=true]{color:var(--magenta);border-color:var(--magenta);box-shadow:0 0 10px rgba(255,42,109,.35)}
.note{color:var(--faint);font-family:var(--mono);font-size:13px;margin:0 0 12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input[type=search]{flex:1 1 220px;min-width:0;background:var(--panel-2);border:1px solid var(--line-bright);color:var(--text);
  font:inherit;padding:9px 12px;border-radius:6px}
button{font:600 15px var(--ui);letter-spacing:.5px;background:var(--panel);color:var(--text);border:1px solid var(--line-bright);
  padding:9px 12px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--cyan)}
button:disabled{opacity:.4;cursor:default}
h2{font-family:var(--pixel);font-size:15px;letter-spacing:2px;color:var(--amber);margin:22px 0 8px;font-weight:400}
.list{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);min-height:44px}
.row:first-child{border-top:0}
.row label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .size{font-family:var(--mono);font-size:13px;color:var(--faint);white-space:nowrap}
.row.changed .name{color:var(--amber)}
.show>.row{background:var(--panel-2)}
.show .eps{display:none}
.show.open .eps{display:block}
.eps .row{padding-left:40px}
.eps .sub{padding:6px 12px 2px 40px;color:var(--faint);font-family:var(--mono);font-size:12px;border-top:1px solid var(--line)}
.twist{background:none;border:0;color:var(--dim);padding:4px 8px;font-family:var(--mono)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--magenta);flex:none}
.tag{font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--line-bright);border-radius:4px;padding:0 4px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(14,10,30,.96);border-top:1px solid var(--line-bright);
  padding:12px var(--gutter) calc(12px + env(safe-area-inset-bottom));z-index:5}
.bar .in{max-width:820px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar .sum{flex:1;font-family:var(--mono);font-size:14px;color:var(--dim);min-width:200px}
.bar .sum b{color:var(--phosphor);font-weight:400}
.bar .sum .chg{color:var(--amber)}
#save{border-color:var(--magenta);color:var(--magenta)}
#msg{font-family:var(--mono);font-size:13px;color:var(--dim);width:100%}
.empty{padding:16px;color:var(--faint)}
</style>
</head>
<body>
<main>
  <header>
    <h1>HANDHELD PICKS</h1>
    <a href="/">&larr; uplink</a>
  </header>
  <div class="tabs" id="tabs" role="tablist"></div>
  <p class="note" id="note"></p>
  <div class="tools">
    <input type="search" id="q" placeholder="filter: title or show" aria-label="Filter">
    <button id="all">Pick shown</button>
    <button id="none">Unpick shown</button>
    <button id="expand">Expand all</button>
  </div>
  <div id="lists"></div>
</main>
<div class="bar"><div class="in">
  <div class="sum" id="sum"></div>
  <button id="undo" disabled>Undo changes</button>
  <button id="save" disabled>Save picks</button>
  <div id="msg"></div>
</div></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids) e.append(k);
  return e;
};
const gb = n => (n / 2 ** 30).toFixed(n >= 10 * 2 ** 30 ? 0 : 1) + " GB";
const mb = n => n >= 2 ** 30 ? gb(n) : Math.round(n / 2 ** 20) + " MB";
const stem = p => p.split("/").pop().replace(/\.[^.]+$/, "");

let device = null, items = [], saved = new Set(), picked = new Set(), openShows = new Set();

async function loadDevices() {
  const r = await fetch("/api/media/devices");
  const d = await r.json();
  const video = d.devices.filter(x => x.tags.some(t => ["handheld", "medium_graphics", "high_graphics"].includes(t)));
  const handhelds = video.filter(x => x.tags.includes("handheld"));
  const tabs = $("#tabs");
  for (const dev of handhelds.length ? handhelds : video) {
    tabs.append(el("button", {class: "tab", role: "tab", "data-name": dev.name, onclick: () => choose(dev.name)}, dev.name.toUpperCase()));
  }
  const want = new URLSearchParams(location.search).get("device");
  choose(want && tabs.querySelector(`[data-name="${CSS.escape(want)}"]`) ? want : tabs.firstChild?.dataset.name);
}

async function choose(name) {
  if (!name) { $("#lists").replaceChildren(el("div", {class: "empty"}, "No handhelds in devices.yaml.")); return; }
  if (dirty() && !confirm("Leave without saving these picks?")) return;
  device = name;
  history.replaceState(null, "", "?device=" + encodeURIComponent(name));
  for (const t of document.querySelectorAll(".tab")) t.setAttribute("aria-selected", t.dataset.name === name);
  $("#msg").textContent = "loading…";
  const r = await fetch("/api/media/catalog?device=" + encodeURIComponent(name));
  const d = await r.json();
  items = d.items;
  saved = new Set(items.filter(i => i.picked).map(i => i.path));
  picked = new Set(saved);
  $("#note").textContent = (d.note ? d.note + ". " : "") +
    (d.picked ? "Picks saved " + new Date(d.updated * 1000).toLocaleString() + "." : "No picks saved yet: it gets everything.") +
    " Sync it from the laptop: tools/handheld_sync.py " + name;
  $("#msg").textContent = "";
  render();
}

function dirty() {
  if (picked.size !== saved.size) return true;
  for (const p of picked) if (!saved.has(p)) return true;
  return false;
}

function matches(i, q) {
  return !q || i.path.toLowerCase().includes(q);
}

function row(i) {
  const cb = el("input", {type: "checkbox"});
  cb.checked = picked.has(i.path);
  cb.addEventListener("change", () => { cb.checked ? picked.add(i.path) : picked.delete(i.path); refresh(); });
  const extra = [];
  if (i.waiting) extra.push(el("span", {class: "tag", title: "its 480p copy isn't made yet"}, "converting"));
  if (i.audio === "sub") extra.push(el("span", {class: "tag"}, "sub"));
  const r = el("div", {class: "row", "data-path": i.path},
    el("label", {}, cb, el("span", {class: "name", title: i.path}, stem(i.path)), ...extra),
    el("span", {class: "size"}, mb(i.bytes)));
  r.cb = cb;
  return r;
}

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const lists = $("#lists");
  lists.replaceChildren();
  const movies = items.filter(i => i.kind === "movie" && matches(i, q));
  const shows = new Map();
  for (const i of items.filter(i => i.kind === "show" && matches(i, q))) {
    if (!shows.has(i.series)) shows.set(i.series, []);
    shows.get(i.series).push(i);
  }
  if (movies.length) {
    lists.append(el("h2", {}, `MOVIES · ${movies.length}`), el("div", {class: "list"}, ...movies.map(row)));
  }
  if (shows.size) {
    const box = el("div", {class: "list"});
    for (const [series, eps] of shows) {
      const head = el("input", {type: "checkbox"});
      const count = el("span", {class: "size"});
      const twist = el("button", {class: "twist", "aria-label": "episodes"}, "▸");
      const wrap = el("div", {class: "show" + (openShows.has(series) || q ? " open" : ""), "data-series": series});
      twist.addEventListener("click", () => { wrap.classList.toggle("open"); wrap.classList.contains("open") ? openShows.add(series) : openShows.delete(series); });
      head.addEventListener("change", () => { for (const e of eps) head.checked ? picked.add(e.path) : picked.delete(e.path); refresh(); });
      const top = el("div", {class: "row"}, twist, el("label", {}, head, el("span", {class: "name"}, series)), count);
      const body = el("div", {class: "eps"});
      let lastDir = null;
      for (const e of eps) {
        const dir = e.path.split("/").slice(3, -1).join(" / ");
        if (dir && dir !== lastDir) body.append(el("div", {class: "sub"}, dir));
        lastDir = dir;
        body.append(row(e));
      }
      wrap.append(top, body);
      wrap.head = head; wrap.count = count; wrap.eps = eps;
      box.append(wrap);
    }
    lists.append(el("h2", {}, `TV · ${shows.size} shows`), box);
  }
  if (!movies.length && !shows.size) lists.append(el("div", {class: "empty"}, "Nothing matches."));
  refresh();
}

function refresh() {
  for (const r of document.querySelectorAll(".row[data-path]")) {
    const p = r.dataset.path;
    r.cb.checked = picked.has(p);
    r.classList.toggle("changed", picked.has(p) !== saved.has(p));
  }
  for (const s of document.querySelectorAll(".show")) {
    const n = s.eps.filter(e => picked.has(e.path)).length;
    s.head.checked = n === s.eps.length;
    s.head.indeterminate = n > 0 && n < s.eps.length;
    const bytes = s.eps.filter(e => picked.has(e.path)).reduce((a, e) => a + e.bytes, 0);
    s.count.textContent = `${n}/${s.eps.length} · ${mb(bytes)}`;
  }
  const total = items.filter(i => picked.has(i.path)).reduce((a, i) => a + i.bytes, 0);
  const add = [...picked].filter(p => !saved.has(p)).length;
  const drop = [...saved].filter(p => !picked.has(p)).length;
  $("#sum").innerHTML = "";
  $("#sum").append(el("b", {}, `${picked.size} of ${items.length} videos · ${gb(total)}`));
  if (add || drop) $("#sum").append(el("span", {class: "chg"}, ` · +${add} / -${drop} unsaved`));
  $("#save").disabled = $("#undo").disabled = !dirty();
}

function shownPaths() {
  return [...document.querySelectorAll(".row[data-path]")].map(r => r.dataset.path);
}

$("#q").addEventListener("input", render);
$("#all").addEventListener("click", () => { for (const p of shownPaths()) picked.add(p); refresh(); });
$("#none").addEventListener("click", () => { for (const p of shownPaths()) picked.delete(p); refresh(); });
$("#expand").addEventListener("click", () => {
  const shows = document.querySelectorAll(".show");
  const open = [...shows].some(s => !s.classList.contains("open"));
  for (const s of shows) { s.classList.toggle("open", open); open ? openShows.add(s.dataset.series) : openShows.delete(s.dataset.series); }
  $("#expand").textContent = open ? "Collapse all" : "Expand all";
});
$("#undo").addEventListener("click", () => { picked = new Set(saved); refresh(); });
$("#save").addEventListener("click", async () => {
  $("#save").disabled = true;
  $("#msg").textContent = "saving…";
  const r = await fetch("/api/media/picks?device=" + encodeURIComponent(device), {
    method: "POST", headers: {"Content-Type": "application/json", "X-Presto": "1"},
    body: JSON.stringify({paths: [...picked]}),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { $("#msg").textContent = "not saved: " + (d.error || r.status); refresh(); return; }
  saved = new Set(picked);
  $("#msg").textContent = `saved: ${d.picked} videos. Plug the handheld into the laptop and run tools/handheld_sync.py ${device}.`;
  refresh();
});
addEventListener("beforeunload", e => { if (dirty()) e.preventDefault(); });
loadDevices();
</script>
</body>
</html>
