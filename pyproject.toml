[tool.poetry]
name = "presto"
version = "0.6.3"
description = "The brick homelab's Pimoroni Presto: a neon desk display (MicroPython app), and presto-photos (its upload page and photo converter)"
authors = ["Patrick White <whitep@alumni.vcu.edu>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
# presto-photos (the image's only code; the device app is MicroPython)
pillow = "^12.0"
pillow-heif = "^1.1"
numpy = "^2.2"
prometheus-client = "^0.22.0"
brick-observe = { git = "https://github.com/operations-ivy/brick-observe.git", tag = "v0.1.1", extras = ["metrics", "tracing"] }

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
pytest = "^8.3.5"
mpremote = "^1.24"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry>=1.3.2"]
build-backend = "poetry.masonry.api"
