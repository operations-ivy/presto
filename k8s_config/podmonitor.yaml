# Prometheus scrapes /metrics on both pods: request metrics (brick-observe),
# uploads by result, conversions by result and their time, the store's size;
# media uploads, filings and the library's size; the feed's refreshes and age; the pager's calls to Alertmanager.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: presto-photos
  namespace: presto
spec:
  selector:
    matchExpressions:
    - key: app
      operator: In
      values: [presto-photos-web, presto-photos-convert, presto-media-sort, presto-feed, presto-alerts]
  podMetricsEndpoints:
  - port: http
    path: /metrics
    interval: 30s
