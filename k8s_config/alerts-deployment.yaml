# presto-alerts: the Presto's pager (presto#52), a read and silence API in front
# of Alertmanager, asked live on each request (the Presto polls every couple of
# minutes). No volume and no token (Alertmanager has no login); NetworkPolicy
# lets it reach only Alertmanager, DNS and the trace collector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presto-alerts
  namespace: presto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: presto-alerts
  template:
    metadata:
      labels:
        app: presto-alerts
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: alerts
        image: whitepatrick/presto-photos
        imagePullPolicy: IfNotPresent
        args: ["alerts"]
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317"
        - name: LOG_FORMAT
          value: json
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 40Mi
          limits:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
