# Nothing in or out of the namespace unless listed here. The converter decodes
# files anyone on the LAN can upload, so it can reach only DNS and the trace
# collector: a crafted image that took it over would find nowhere to go.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: presto
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# The page: from Traefik (the front door's route in) and Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-ingress
  namespace: presto
spec:
  podSelector:
    matchLabels:
      app: presto-photos-web
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - port: 8080
---
# The converter takes nothing in but Prometheus' scrape.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: convert-ingress
  namespace: presto
spec:
  podSelector:
    matchLabels:
      app: presto-photos-convert
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - port: 8080
---
# The feed: from Traefik (GET /brick.json) and Prometheus' scrape.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: feed-ingress
  namespace: presto
spec:
  podSelector:
    matchLabels:
      app: presto-feed
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - port: 8080
---
# The feed, and only the feed, may ask Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: feed-egress-prometheus
  namespace: presto
spec:
  podSelector:
    matchLabels:
      app: presto-feed
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - port: 9090
---
# Every pod: out to DNS and the OpenTelemetry collector only. No internet, no
# LAN, no other service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-dns-and-traces
  namespace: presto
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: opentelemetry-collector
    ports:
    - port: 4317
