# The upload page and the Presto's files. It never decodes an image (the
# converter does, sandboxed), so it stays small.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presto-photos-web
  namespace: presto
spec:
  replicas: 1
  # One pod with the volume: a rollout stops the old pod first (RWO local-path).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: presto-photos-web
  template:
    metadata:
      labels:
        app: presto-photos-web
    spec:
      # The volume is on brick2000 (local-path), and so is this pod.
      nodeSelector:
        chuck.io/storage-node: "true"
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: whitepatrick/presto-photos
        imagePullPolicy: IfNotPresent
        args: ["web"]
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317"
        - name: LOG_FORMAT
          value: json
        - name: PHOTOS_ROOT
          value: /data
        - name: PHOTOS_LIMIT_GB
          value: "5"
        volumeMounts:
        - name: photos
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 192Mi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
      volumes:
      - name: photos
        persistentVolumeClaim:
          claimName: presto-photos
      # The root is read-only; a library wanting scratch space gets a small tmpfs.
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
