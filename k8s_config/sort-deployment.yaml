# The media sorter (presto_photos/sorter.py): files audio and video uploads
# from the media inbox onto brick2000's media drive (/extra, exFAT), with
# clean names, and keeps the library index the page's sync API reads.
#
# - uid 1000: the drive is mounted uid=1000 with 0755 folders, so only that
#   uid can write there. Group 65532 too: the page (uid 65532) owns the
#   uploads, in a setgid, group-writable inbox/, so the sorter can remove
#   what it has filed.
# - It reads untrusted files (mutagen reads audio tags), so it's boxed in like
#   the converter: no network but DNS and traces (networkpolicy.yaml), no
#   service-account token, a read-only root, no capabilities.
# - The movies folder must exist (the drive is mounted): `Directory`, so the
#   pod waits rather than filing onto brick2000's root disk. music is new and
#   made on first use; the sorter checks it's on the same disk as movies.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presto-media-sort
  namespace: presto
spec:
  replicas: 1
  # Exactly one sorter: two would race for the same uploads.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: presto-media-sort
  template:
    metadata:
      labels:
        app: presto-media-sort
    spec:
      # The drive and the inbox volume are both on brick2000.
      nodeSelector:
        kubernetes.io/hostname: brick2000
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        supplementalGroups: [65532]
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: sort
        image: whitepatrick/presto-photos
        imagePullPolicy: IfNotPresent
        args: ["sort"]
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317"
        - name: LOG_FORMAT
          value: json
        - name: MEDIA_ROOT
          value: /media
        - name: MOVIES_ROOT
          value: /movies
        - name: MUSIC_ROOT
          value: /music
        volumeMounts:
        - name: inbox
          mountPath: /media
        - name: movies
          mountPath: /movies
        - name: music
          mountPath: /music
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:  # it copies in 8 MB pieces; the page cache it fills is reclaimable
            cpu: 500m
            memory: 256Mi
        # Prometheus' metrics server answers every path, /health included.
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
      volumes:
      - name: inbox
        persistentVolumeClaim:
          claimName: presto-media-inbox
      - name: movies
        hostPath:
          path: /extra/movies
          type: Directory
      - name: music
        hostPath:
          path: /extra/music
          type: DirectoryOrCreate
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
