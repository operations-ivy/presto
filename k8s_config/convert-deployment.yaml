# The converter: decodes uploads (HEIC, JPEG, PNG) and renders the Presto's
# frames. Image decoders have a history of holes, so it's boxed in: no network
# but DNS and the trace collector (networkpolicy.yaml), no service-account
# token, a read-only root, every capability dropped, and hard limits (a 24 MP
# HEIC decodes to ~290 MB of float32 at its peak).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presto-photos-convert
  namespace: presto
spec:
  replicas: 1
  # Exactly one converter at a time: two would race for the same uploads.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: presto-photos-convert
  template:
    metadata:
      labels:
        app: presto-photos-convert
    spec:
      nodeSelector:
        chuck.io/storage-node: "true"
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: convert
        image: whitepatrick/presto-photos
        imagePullPolicy: IfNotPresent
        args: ["convert"]
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317"
        - name: LOG_FORMAT
          value: json
        - name: PHOTOS_ROOT
          value: /data
        - name: PHOTOS_LIMIT_GB
          value: "5"
        volumeMounts:
        - name: photos
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:  # a 24 MP iPhone photo peaks near 550 MB; 48 MP about double
            cpu: "2"
            memory: 2Gi
        # Prometheus' metrics server answers every path, /health included.
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
      volumes:
      - name: photos
        persistentVolumeClaim:
          claimName: presto-photos
      # The root is read-only; a library wanting scratch space gets a small tmpfs.
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
