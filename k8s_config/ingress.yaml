apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: presto-photos-web
  namespace: presto
spec:
  ingressClassName: traefik
  rules:
  # Through the cluster's front door (brick-k8s-config front-door/).
  - host: presto.brick.nozdormu.cloud
    http:
      paths:
      # The pager (presto-alerts, presto#52): what's firing, and a 1 hour silence.
      # Prefix, not Exact: Traefik ranks routes by rule length, and Path(`/alerts`)
      # ties PathPrefix(`/`) at 15 characters, so the catch-all won now and then.
      - path: /alerts
        pathType: Prefix
        backend:
          service:
            name: presto-alerts
            port:
              number: 80
      - path: /silence
        pathType: Exact
        backend:
          service:
            name: presto-alerts
            port:
              number: 80
      # The Brick screen's feed (presto-feed); everything else is the photo page.
      - path: /brick.json
        pathType: Exact
        backend:
          service:
            name: presto-feed
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: presto-photos-web
            port:
              number: 80
