# presto-feed: the Brick screen's JSON (presto#5), built from Prometheus every
# 30 s. No volume and no token (Prometheus has no login), so it runs on any
# worker; NetworkPolicy lets it reach only Prometheus, DNS and the trace collector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presto-feed
  namespace: presto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: presto-feed
  template:
    metadata:
      labels:
        app: presto-feed
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: feed
        image: whitepatrick/presto-photos
        imagePullPolicy: IfNotPresent
        args: ["feed"]
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317"
        - name: LOG_FORMAT
          value: json
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
